
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ItaAkum | Under Construction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #222222;
            min-height: 100vh;
        }

        /* Loading Screen */
        #loader {
            position: fixed;
            inset: 0;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 1000;
        }

        .loader-name {
            font-size: 32px;
            font-weight: bold;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #dddddd;
            border-top-color: #333333;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Main Content */
        main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            text-align: center;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 12px;
        }

        h2 {
            font-size: 21px;
            font-weight: normal;
            margin-bottom: 10px;
        }

        p {
            color: #777777;
            margin-bottom: 25px;
        }

        /* YouTube Video */
        .video-container {
            width: 100%;
            max-width: 750px;
            aspect-ratio: 16 / 9;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
        }

    </style>
</head>

<body>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="loader-name">ItaAkum</div>
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

    <!-- Website Content -->
    <main>

        <h1>ItaAkum</h1>

        <h2>Under Construction</h2>

        <p>Something new is taking shape. Stay tuned.</p>

        <p>Watch the journey of this website being built.</p>

        <div class="video-container">
            <iframe
                src="https://www.youtube.com/embed/noKD2_RRoug"
                title="The Making of ItaAkum"
                allowfullscreen>
            </iframe>
        </div>

    </main>

    <script>
        window.addEventListener("load", function () {
            document.getElementById("loader").style.display = "none";
        });
    </script>

</body>
</html>
